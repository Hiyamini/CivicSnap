# Default: H2 file database (extra install avasaram ledu). Postgres kosam kinda comments maarchandi.
spring.datasource.url=jdbc:h2:file:./data/civicsnap;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# PostgreSQL vadalante:
# spring.datasource.url=jdbc:postgresql://localhost:5432/civicsnap
# spring.datasource.username=postgres
# spring.datasource.password=yourpassword

server.port=8080
server.error.include-message=always

# Photo/video upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.upload-dir=uploads

# JWT: production lo env variable tho maarchandi (32+ characters)
app.jwt.secret=${JWT_SECRET:civic-snap-dev-secret-change-me-please-32chars}
app.jwt.hours=72

# Frontend dev server origin (CORS)
app.cors.origin=http://localhost:5173
